<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="260" height="320" role="img" aria-label="Pakistan Air Force badge">
  <defs>
    <linearGradient id="pafGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d565"/>
      <stop offset="1" stop-color="#c8962a"/>
    </linearGradient>
    <linearGradient id="pafBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5f9e"/>
      <stop offset="1" stop-color="#1b3f73"/>
    </linearGradient>
  </defs>

  <!-- Star and crescent pinnacle -->
  <g transform="translate(130,26)">
    <path d="M-8 -3 a17 17 0 1 0 34 0 a13 13 0 1 1 -34 0 z" fill="url(#pafGold)" transform="rotate(-20)"/>
    <path d="M14 -11 l1.9 4.8 4.8 1.9 -4.8 1.9 -1.9 4.8 -1.9 -4.8 -4.8 -1.9 4.8 -1.9 z" fill="url(#pafGold)"/>
  </g>

  <!-- Ornate top scroll -->
  <g fill="url(#pafGold)" stroke="#8a661e" stroke-width="1">
    <path d="M70 54 c0 -5 13 -8 27 -8 c14 0 27 3 27 8 c0 5 -13 8 -27 8 c-14 0 -27 -3 -27 -8 z"/>
    <circle cx="130" cy="42" r="5" fill="#c8962a"/>
    <circle cx="34" cy="52" r="4" fill="#c8962a"/>
    <circle cx="226" cy="52" r="4" fill="#c8962a"/>
  </g>

  <!-- Central roundel -->
  <g transform="translate(130,158)">
    <circle cx="0" cy="0" r="96" fill="url(#pafBlue)" stroke="url(#pafGold)" stroke-width="4"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#f6d565" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>

    <!-- Iqbal poetry verse scroll (above eagle) -->
    <g transform="translate(0,-58)">
      <path d="M-72 -12 h144 l7 9 l-7 9 h-144 l-7 -9 z" fill="url(#pafGold)" stroke="#8a661e" stroke-width="1"/>
      <text x="0" y="6" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-style="italic"
            fill="#1b3f73" text-anchor="middle">Be it land or sea, all is beneath my wings</text>
    </g>

    <!-- Spread Shaheen eagle -->
    <g transform="translate(0,22)">
      <!-- body -->
      <ellipse cx="0" cy="0" rx="14" ry="26" fill="url(#pafGold)" stroke="#8a661e" stroke-width="1"/>
      <!-- head -->
      <circle cx="0" cy="-26" r="7" fill="url(#pafGold)" stroke="#8a661e" stroke-width="1"/>
      <!-- beak -->
      <path d="M-2 -32 l-6 -6 l6 1 z" fill="#c8962a"/>
      <path d="M2 -32 l6 -6 l-6 1 z" fill="#c8962a"/>
      <!-- left wing -->
      <path d="M-13 -6 C-32 -26 -62 -34 -78 -30 C-64 -14 -48 0 -34 10 C-28 14 -20 12 -14 6 z"
            fill="url(#pafGold)" stroke="#8a661e" stroke-width="1.2"/>
      <!-- right wing -->
      <path d="M13 -6 C32 -26 62 -34 78 -30 C64 -14 48 0 34 10 C28 14 20 12 14 6 z"
            fill="url(#pafGold)" stroke="#8a661e" stroke-width="1.2"/>
      <!-- wing feather lines left -->
      <g stroke="#8a661e" stroke-width="0.8" fill="none">
        <path d="M-18 -18 l-34 -4"/>
        <path d="M-20 -10 l-30 2"/>
        <path d="M-18 -2 l-22 4"/>
      </g>
      <!-- wing feather lines right -->
      <g stroke="#8a661e" stroke-width="0.8" fill="none">
        <path d="M18 -18 l34 -4"/>
        <path d="M20 -10 l30 2"/>
        <path d="M18 -2 l22 4"/>
      </g>
      <!-- tail feathers -->
      <g fill="url(#pafGold)" stroke="#8a661e" stroke-width="0.8">
        <path d="M-8 24 l-6 10 h12 z"/>
        <path d="M-3 26 l-4 12 h8 z"/>
        <path d="M3 26 l4 12 h-8 z"/>
        <path d="M8 24 l6 10 h-12 z"/>
      </g>
      <!-- feet -->
      <g stroke="#c8962a" stroke-width="2" fill="none">
        <path d="M-5 24 l-5 8"/>
        <path d="M5 24 l5 8"/>
      </g>
    </g>

    <!-- Crowning star near top of roundel -->
    <path d="M0 -84 l2.6 6.6 6.6 2.6 -6.6 2.6 -2.6 6.6 -2.6 -6.6 -6.6 -2.6 6.6 -2.6 z"
          fill="url(#pafGold)"/>
  </g>

  <!-- Outer ring text label -->
  <g>
    <text x="130" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold"
          fill="#8a661e" text-anchor="middle" letter-spacing="2.5">PAKISTAN AIR FORCE</text>
  </g>

  <!-- Base banner -->
  <g transform="translate(130,294)">
    <path d="M-74 -11 h148 l6 15 l-6 15 h-148 l-6 -15 z" fill="url(#pafBlue)" stroke="url(#pafGold)" stroke-width="2.5"/>
    <path d="M-74 -11 c6 3 13 3 19 0 c-6 -3 -13 -3 -19 0 z" fill="url(#pafGold)"/>
    <path d="M74 -11 c-6 3 -13 3 -19 0 c6 -3 13 -3 19 0 z" fill="url(#pafGold)"/>
    <text x="0" y="8" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold"
          fill="#ffffff" text-anchor="middle" letter-spacing="2">P.A.F.</text>
  </g>
</svg>
