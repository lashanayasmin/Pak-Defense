<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" width="260" height="340" role="img" aria-label="Pakistan Navy crest">
  <defs>
    <linearGradient id="navyGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d565"/>
      <stop offset="1" stop-color="#c8962a"/>
    </linearGradient>
    <linearGradient id="navyBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15375e"/>
      <stop offset="1" stop-color="#0c2340"/>
    </linearGradient>
  </defs>

  <!-- Star and crescent pinnacle -->
  <g transform="translate(130,34)">
    <path d="M-10 -4 a20 20 0 1 0 40 0 a16 16 0 1 1 -40 0 z" fill="#ffffff" transform="rotate(-20)"/>
    <path d="M16 -14 l2.2 5.6 5.6 2.2 -5.6 2.2 -2.2 5.6 -2.2 -5.6 -5.6 -2.2 5.6 -2.2 z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" opacity="0"/>
  </g>

  <!-- Ornate scrollwork top banner -->
  <g fill="url(#navyGold)" stroke="#8a661e" stroke-width="1">
    <path d="M60 62 c0 -6 14 -10 30 -10 c16 0 30 4 30 10 c0 6 -14 10 -30 10 c-16 0 -30 -4 -30 -10 z"/>
    <circle cx="120" cy="34" r="7" fill="#c8962a"/>
    <circle cx="40" cy="50" r="5" fill="#c8962a"/>
    <circle cx="220" cy="50" r="5" fill="#c8962a"/>
  </g>

  <!-- Central shield -->
  <g>
    <path d="M60 70 l100 -12 60 12 0 0 v190 c0 8 -28 24 -80 24 c-52 0 -80 -16 -80 -24 z"
          fill="url(#navyBlue)" stroke="url(#navyGold)" stroke-width="5"/>
    <path d="M66 76 l94 -10 54 10 v182 c0 6 -22 18 -74 18 c-52 0 -74 -12 -74 -18 z"
          fill="none" stroke="#f6d565" stroke-width="1.5" opacity="0.55"/>
  </g>

  <!-- Shield inner content -->
  <g>
    <!-- Wreath / laurel scrolls -->
    <g fill="none" stroke="url(#navyGold)" stroke-width="3">
      <path d="M92 260 c-18 -14 -28 -40 -24 -70 c4 -32 12 -52 28 -56"/>
      <path d="M92 260 c-10 -20 -16 -46 -12 -72 c4 -26 14 -42 26 -48"/>
      <path d="M168 260 c18 -14 28 -40 24 -70 c-4 -32 -12 -52 -28 -56"/>
      <path d="M168 260 c10 -20 16 -46 12 -72 c-4 -26 -14 -42 -26 -48"/>
    </g>

    <!-- Fouled anchor -->
    <g transform="translate(130,150)" fill="url(#navyGold)" stroke="#8a661e" stroke-width="1">
      <!-- ring at top of anchor -->
      <circle cx="0" cy="-72" r="7" fill="none" stroke="url(#navyGold)" stroke-width="4"/>
      <!-- shank -->
      <rect x="-4" y="-66" width="8" height="120" rx="4"/>
      <!-- stock (horizontal bar) -->
      <rect x="-30" y="-56" width="60" height="8" rx="4"/>
      <!-- arms (flukes) -->
      <path d="M-4 -44 C-4 -6 -22 10 -30 14 L0 40 L26 14 C24 10 4 -6 4 -44 z"/>
      <!-- rope around shank -->
      <g fill="none" stroke="#ffffff" stroke-width="2.5">
        <path d="M-11 -40 c6 -3 16 -3 22 0"/>
        <path d="M-11 -28 c6 -3 16 -3 22 0"/>
        <path d="M-11 -16 c6 -3 16 -3 22 0"/>
      </g>
    </g>

    <!-- Small star and crescent inside lower shield -->
    <g transform="translate(130,262)">
      <path d="M-8 -3 a15 15 0 1 0 30 0 a11 11 0 1 1 -30 0 z" fill="url(#navyGold)" transform="rotate(-18)"/>
      <path d="M12 -10 l1.7 4.3 4.3 1.7 -4.3 1.7 -1.7 4.3 -1.7 -4.3 -4.3 -1.7 4.3 -1.7 z" fill="url(#navyGold)"/>
    </g>
  </g>

  <!-- Base ribbon banner -->
  <g transform="translate(130,298)">
    <path d="M-82 -14 h164 l6 17 l-6 17 h-164 l-6 -17 z" fill="url(#navyBlue)" stroke="url(#navyGold)" stroke-width="2.5"/>
    <path d="M-82 -14 c6 3 14 3 20 0 c-6 -3 -14 -3 -20 0 z" fill="url(#navyGold)"/>
    <path d="M82 -14 c-6 3 -14 3 -20 0 c6 -3 14 -3 20 0 z" fill="url(#navyGold)"/>
    <path d="M-82 34 c6 -3 14 -3 20 0 c-6 3 -14 3 -20 0 z" fill="url(#navyGold)"/>
    <path d="M82 34 c-6 3 -14 -3 -20 0 c6 -3 14 -3 20 0 z" fill="url(#navyGold)"/>
    <text x="0" y="10" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold"
          fill="#ffffff" text-anchor="middle" letter-spacing="3">PAKISTAN NAVY</text>
  </g>
</svg>
